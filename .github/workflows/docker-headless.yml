name: Docker headless image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-headless.yml"
      - "Makefile"
      - "src/**"
      - "include/**"
      - "actors/**"
      - "levels/**"
      - "bin/**"
      - "data/**"
      - "sound/**"
      - "text/**"
      - "textures/**"
      - "lib/**"
      - "tools/**"
      - "mods/**"
      - "dynos/**"
      - "lang/**"
      - "palettes/**"
      - "assets.json"
      - "charmap*.txt"
      - "updater/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=headless,enable={{is_default_branch}}
            type=raw,value=headless,enable=${{ github.ref == 'refs/heads/feat/headless-docker' }}
            type=sha,prefix=headless-
            type=ref,event=branch,prefix=headless-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
